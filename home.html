<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZeroDay Security Signals — Latest updates from your cybersecurity network.">
  <title>ZeroDay — Security Signals</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Navigation (injected by JS) -->
  <div id="nav-container"></div>

  <!-- Main Content -->
  <main class="zd-main">
    <!-- Page Header -->
    <div class="page-header">
      <div>
        <span class="page-kicker">Operational Feed</span>
        <h1 style="margin:0;">Security Signals</h1>
      </div>
      <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap;">
        <span class="page-status">Network live</span>
        <button class="btn-zd-primary" onclick="openNewSignalModal()">
          + New Signal
        </button>
      </div>
    </div>

    <!-- Layout: Signals Feed + Sidebar -->
    <div class="zd-sidebar-layout" style="grid-template-columns:1fr 320px;">

      <!-- Signals Feed -->
      <div>
        <!-- Filter Tabs -->
        <div class="zd-tabs" id="signal-tabs">
          <button class="zd-tab active" data-filter="all" onclick="filterSignals('all', this)">All</button>
          <button class="zd-tab" data-filter="THREAT" onclick="filterSignals('THREAT', this)">Threat</button>
          <button class="zd-tab" data-filter="RESEARCH" onclick="filterSignals('RESEARCH', this)">Research</button>
          <button class="zd-tab" data-filter="LEARNING" onclick="filterSignals('LEARNING', this)">Learning</button>
          <button class="zd-tab" data-filter="TOOL" onclick="filterSignals('TOOL', this)">Tool</button>
          <button class="zd-tab" data-filter="CTF" onclick="filterSignals('CTF', this)">CTF</button>
          <button class="zd-tab" data-filter="ALERT" onclick="filterSignals('ALERT', this)">Alert</button>
        </div>

        <!-- Signal Cards Container -->
        <div id="signals-feed"></div>
      </div>

      <!-- Sidebar -->
      <aside>
        <!-- Active Threats Summary -->
        <div class="zd-panel mb-lg">
          <div class="zd-panel-header">
            <span class="zd-panel-title">▲ Active Threats</span>
            <a href="threat-watch.html" class="technical-label" style="color:var(--zd-action);font-size:0.65rem;">VIEW
              ALL</a>
          </div>
          <div id="sidebar-threats"></div>
        </div>

        <!-- Online Connections -->
        <div class="zd-panel mb-lg">
          <div class="zd-panel-header">
            <span class="zd-panel-title">◇ Online Now</span>
            <a href="connections.html" class="technical-label" style="color:var(--zd-action);font-size:0.65rem;">VIEW
              ALL</a>
          </div>
          <div id="sidebar-online"></div>
        </div>

        <!-- Quick Stats -->
        <div class="zd-panel">
          <div class="zd-panel-header">
            <span class="zd-panel-title">◈ Network Status</span>
          </div>
          <div class="row g-0" id="sidebar-stats"></div>
        </div>
      </aside>
    </div>
  </main>

  <!-- New Signal Modal -->
  <div class="modal fade" id="newSignalModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><span class="technical-label">NEW SECURITY SIGNAL</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="new-signal-form" novalidate>
            <div class="row">
              <div class="col-md-6">
                <div class="zd-form-group">
                  <label class="zd-label" for="signal-category">Signal Category</label>
                  <select class="zd-select" id="signal-category" required>
                    <option value="">Select category...</option>
                    <option value="THREAT">Threat</option>
                    <option value="RESEARCH">Research</option>
                    <option value="LEARNING">Learning</option>
                    <option value="TOOL">Tool</option>
                    <option value="CTF">CTF</option>
                    <option value="DISCUSSION">Discussion</option>
                    <option value="ALERT">Alert</option>
                    <option value="GENERAL">General</option>
                  </select>
                  <div class="zd-error-msg" id="category-error">Select a signal category.</div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="zd-form-group">
                  <label class="zd-label" for="signal-risk">Risk Level (optional)</label>
                  <select class="zd-select" id="signal-risk">
                    <option value="">None</option>
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                  </select>
                </div>
              </div>
            </div>
            <div class="zd-form-group">
              <label class="zd-label" for="signal-title">Signal Title</label>
              <input type="text" class="zd-input" id="signal-title" placeholder="Brief descriptive title" required>
              <div class="zd-error-msg" id="title-error">Signal title is required.</div>
            </div>
            <div class="zd-form-group">
              <label class="zd-label" for="signal-content">Signal Content</label>
              <textarea class="zd-textarea" id="signal-content" placeholder="Describe the security signal in detail..."
                rows="4" required></textarea>
              <div class="zd-error-msg" id="content-error">Signal content cannot be empty.</div>
            </div>
            <div class="zd-form-group">
              <label class="zd-label" for="signal-image">Attach Image (optional)</label>
              <input type="file" class="zd-input" id="signal-image" accept="image/*">
            </div>
            <div class="zd-form-group">
              <label class="zd-label">Share With</label>
              <div class="form-check" style="margin-bottom:0.5rem;">
                <input class="form-check-input" type="radio" name="share-target" id="share-all-radio" value="all"
                  checked>
                <label class="form-check-label" for="share-all-radio" style="font-size:0.85rem;">All Connections</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="share-target" id="share-selected-radio"
                  value="selected">
                <label class="form-check-label" for="share-selected-radio" style="font-size:0.85rem;">Selected
                  Connections</label>
              </div>
              <div id="selected-connections-list"
                style="display:none;margin-top:0.75rem;max-height:150px;overflow-y:auto;"></div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn-zd-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn-zd-primary" onclick="submitNewSignal()">Transmit Signal</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/home.js"></script>
</body>

</html>
