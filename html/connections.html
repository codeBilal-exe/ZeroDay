<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <meta name="description" content="ZeroDay Network — Manage your cybersecurity connections.">
  <title>ZeroDay — Network</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="nav-container"></div>

  <main class="zd-main">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div>
        <h1 style="margin-bottom:0.25rem;">Security Network</h1>
        <p class="technical-label" style="margin:0;">Manage your connections and invitations</p>
      </div>
    </div>

    <!-- Tabs -->
    <div class="zd-tabs" id="connection-tabs">
      <button class="zd-tab active" onclick="showConnectionTab('connections', this)">My Connections</button>
      <button class="zd-tab" onclick="showConnectionTab('pending', this)" id="pending-tab">
        Pending Requests <span class="badge bg-danger" id="pending-badge" style="font-size:0.55rem;padding:0.12rem 0.35rem;border-radius:6px;display:none;">0</span>
      </button>
      <button class="zd-tab" onclick="showConnectionTab('find', this)">Find People</button>
    </div>

    <!-- Connections Tab -->
    <div id="tab-connections"></div>

    <!-- Pending Requests Tab -->
    <div id="tab-pending" style="display:none;"></div>

    <!-- Find People Tab -->
    <div id="tab-find" style="display:none;"></div>
  </main>

  <!-- Rating Modal -->
  <div class="modal fade" id="ratingModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><span class="technical-label">RATE CONNECTION</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="rating-modal-body"></div>
        <div class="modal-footer">
          <button class="btn-zd-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn-zd-primary" id="save-rating-btn">Save Rating</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/connections.js"></script>
</body>
</html>
