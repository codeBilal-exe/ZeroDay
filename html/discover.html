<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <meta name="description" content="ZeroDay Discover — Find security-minded people and topics.">
  <title>ZeroDay — Discover</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .topic-card {
      background: var(--zd-surface);
      border: 1px solid var(--zd-border);
      padding: var(--space-lg);
      border-radius: var(--radius-lg);
      transition: all var(--transition-base);
      cursor: pointer;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .topic-card:hover {
      background: var(--zd-surface-alt);
      border-color: var(--zd-forest);
      transform: translateY(-2px);
    }
    .topic-icon {
      font-size: 2rem;
      margin-bottom: var(--space-md);
      color: var(--zd-action);
    }
    .discover-section-title {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--zd-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: var(--space-md);
      padding-bottom: var(--space-sm);
      border-bottom: 1px solid var(--zd-border);
    }
  </style>
</head>
<body>

  <div id="nav-container"></div>

  <main class="zd-main">
    <!-- Header & Intelligence Search -->
    <div style="text-align:center;margin-bottom:3rem;">
      <h1 style="font-size:2.5rem;margin-bottom:0.5rem;">Intelligence Discovery</h1>
      <p class="text-muted-zd" style="max-width:600px;margin:0 auto 2rem auto;">Search for people, threat topics, learning guides, and network signals.</p>
      
      <div class="zd-search" style="max-width:600px;margin:0 auto;">
        <span class="search-icon" style="font-size:1rem;"><i class="bi bi-search" aria-hidden="true"></i></span>
        <input type="text" class="zd-input" id="discover-search" placeholder="Search the network..." style="padding: 1rem 1rem 1rem 3rem; font-size: 1rem; border-radius: 30px; background: var(--zd-surface-alt);">
      </div>
    </div>

    <!-- Topics Grid -->
    <div class="mb-xl">
      <div class="discover-section-title">Security Domains</div>
      <div class="row g-4" id="topics-grid">
        <!-- Rendered by JS -->
      </div>
    </div>

    <!-- Suggested People -->
    <div>
      <div class="discover-section-title">Network Suggestions</div>
      <div class="row g-4" id="suggested-people">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('zd:page-ready', () => {
  if (!document.getElementById('topics-grid')) return;
      if (!checkAuth()) return;
      document.getElementById('nav-container').innerHTML = buildNavigation('discover');
      initNavToggle();
      
      renderTopics();
      renderSuggestedPeople();
      
      document.getElementById('discover-search').addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        if (query) {
          // Simple client-side search simulation
          document.getElementById('topics-grid').parentElement.style.display = 'none';
          filterSuggested(query);
        } else {
          document.getElementById('topics-grid').parentElement.style.display = 'block';
          renderSuggestedPeople(); // Reset
        }
      });
    });

    const domains = [
      { id: 'web', title: 'Web Security', icon: 'globe2', desc: 'OWASP, Web app pentesting, API security' },
      { id: 'net', title: 'Network Security', icon: 'diagram-3', desc: 'Firewalls, IDS/IPS, packet analysis, segmentation' },
      { id: 'cloud', title: 'Cloud & DevSecOps', icon: 'cloud', desc: 'AWS/Azure, CI/CD security, container hardening' },
      { id: 'crypto', title: 'Cryptography', icon: 'key', desc: 'Encryption, PKI, post-quantum crypto' },
      { id: 'threat', title: 'Threat Intel', icon: 'binoculars', desc: 'Malware analysis, threat hunting, OSINT' },
      { id: 'aware', title: 'Security Awareness', icon: 'person-check', desc: 'Phishing prevention, social engineering, digital safety' }
    ];

    function renderTopics() {
      const container = document.getElementById('topics-grid');
      container.innerHTML = domains.map(d => `
        <div class="col-md-4 col-sm-6">
          <div class="topic-card" onclick="navigateTo('home.html')">
            <div class="topic-icon">${zdIcon(d.icon)}</div>
            <h3 style="font-size:1.1rem;margin-bottom:0.5rem;">${d.title}</h3>
            <p style="color:var(--zd-muted);font-size:0.85rem;margin:0;flex:1;">${d.desc}</p>
          </div>
        </div>
      `).join('');
    }

    function renderSuggestedPeople() {
      const currentUser = getCurrentUser();
      const container = document.getElementById('suggested-people');
      
      // Recommend people not connected, sorted by highest level
      const suggestions = users
        .filter(u => u.id !== currentUser.id && !currentUser.connections.includes(u.id))
        .sort((a, b) => b.level - a.level)
        .slice(0, 3); // top 3

      if (suggestions.length === 0) {
        container.innerHTML = '<div class="col-12"><p class="text-muted-zd">No new suggestions at this time.</p></div>';
        return;
      }

      container.innerHTML = suggestions.map(u => `
        <div class="col-md-4">
          <div class="user-card" style="height:100%;flex-direction:column;align-items:flex-start;padding:1.5rem;">
            <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1rem;width:100%;">
              <a href="profile.html?id=${u.id}">${renderAvatar(u, 'avatar-md')}</a>
              <div>
                <div style="font-weight:600;"><a href="profile.html?id=${u.id}" style="color:inherit;">${u.name}</a></div>
                <div class="technical-label" style="font-size:0.6rem;">${u.role}</div>
              </div>
            </div>
            <div style="font-size:0.8rem;color:var(--zd-muted);margin-bottom:1rem;line-height:1.5;flex:1;">
              ${u.bio.substring(0, 90)}...
            </div>
            <a href="profile.html?id=${u.id}" class="btn-zd-secondary btn-zd-sm w-100" style="text-align:center;">View Identity</a>
          </div>
        </div>
      `).join('');
    }

    function filterSuggested(query) {
      const currentUser = getCurrentUser();
      const container = document.getElementById('suggested-people');
      const filtered = users.filter(u => u.id !== currentUser.id && (u.name.toLowerCase().includes(query) || u.role.toLowerCase().includes(query) || u.bio.toLowerCase().includes(query)));
      
      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-12"><p class="text-muted-zd">No users match your search.</p></div>';
        return;
      }

      container.innerHTML = filtered.map(u => `
        <div class="col-md-4 mb-4">
          <div class="user-card" style="padding:1.5rem;">
            <div style="display:flex;align-items:center;gap:1rem;width:100%;">
              <a href="profile.html?id=${u.id}">${renderAvatar(u, 'avatar-md')}</a>
              <div>
                <div style="font-weight:600;"><a href="profile.html?id=${u.id}" style="color:inherit;">${u.name}</a></div>
                <div class="technical-label" style="font-size:0.6rem;">${u.role}</div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
