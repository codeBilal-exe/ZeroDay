<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <meta name="description" content="ZeroDay Threat Watch — Global security alerts and awareness.">
  <title>ZeroDay — Threat Watch</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .threat-stat-card {
      background: var(--zd-surface);
      border: 1px solid var(--zd-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .threat-stat-value {
      font-family: var(--font-heading);
      font-size: 3rem;
      font-weight: 700;
      line-height: 1;
      margin-bottom: var(--space-sm);
    }
    .threat-stat-label {
      font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--zd-muted);
    }
    .threat-table-row {
      display: grid;
      grid-template-columns: 100px 150px 1fr 120px;
      gap: var(--space-md);
      padding: var(--space-md);
      border-bottom: 1px solid var(--zd-border);
      align-items: center;
    }
    .threat-table-header {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--zd-muted);
      border-bottom: 2px solid var(--zd-border);
      padding-bottom: var(--space-sm);
    }
    .severity-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 0.4rem;
    }
    
    @media (max-width: 992px) {
      .threat-table-row {
        grid-template-columns: 1fr;
        gap: var(--space-sm);
      }
      .threat-table-header {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div id="nav-container"></div>

  <main class="zd-main">
    <div style="margin-bottom:2.5rem;">
      <h1 style="margin-bottom:0.25rem;">Threat Watch Console</h1>
      <p class="technical-label" style="margin:0;">Simulated active threats and network awareness</p>
    </div>

    <!-- Stats Dashboard -->
    <div class="row g-4 mb-xl">
      <div class="col-md-4">
        <div class="threat-stat-card">
          <div class="threat-stat-value" style="color:var(--zd-error);" id="stat-critical">0</div>
          <div class="threat-stat-label">Critical Alerts</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="threat-stat-card">
          <div class="threat-stat-value" style="color:var(--zd-warning);" id="stat-elevated">0</div>
          <div class="threat-stat-label">Elevated Risks</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="threat-stat-card">
          <div class="threat-stat-value" style="color:var(--zd-action);" id="stat-active">0</div>
          <div class="threat-stat-label">Active Signatures</div>
        </div>
      </div>
    </div>

    <!-- Threat Feed -->
    <div class="zd-panel" style="padding:0;overflow:hidden;">
      <div class="zd-panel-header" style="padding:var(--space-md);margin:0;border-bottom:1px solid var(--zd-border);background:var(--zd-surface-alt);">
        <span class="zd-panel-title"><i class="bi bi-exclamation-triangle" aria-hidden="true"></i> Active network threats</span>
      </div>
      
      <div style="padding:0 var(--space-md);">
        <div class="threat-table-row threat-table-header d-none d-lg-grid">
          <div>Severity</div>
          <div>Category</div>
          <div>Threat Description</div>
          <div style="text-align:right;">Detected</div>
        </div>
        
        <div id="threat-feed-container">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('zd:page-ready', () => {
      if (!checkAuth()) return;
      document.getElementById('nav-container').innerHTML = buildNavigation('threat-watch');
      initNavToggle();

      renderThreatStats();
      renderThreatFeed();
    });

    function renderThreatStats() {
      const critical = threatWatchItems.filter(t => t.severity === 'critical').length;
      const elevated = threatWatchItems.filter(t => t.severity === 'high' || t.severity === 'medium').length;
      
      document.getElementById('stat-critical').textContent = critical;
      document.getElementById('stat-elevated').textContent = elevated;
      document.getElementById('stat-active').textContent = threatWatchItems.length;
    }

    function renderThreatFeed() {
      const container = document.getElementById('threat-feed-container');
      
      const severityColors = {
        'critical': 'var(--zd-error)',
        'high': 'var(--zd-warning)',
        'medium': 'var(--zd-warning)',
        'low': 'var(--zd-highlight)'
      };

      container.innerHTML = threatWatchItems.sort((a, b) => b.date - a.date).map(t => `
        <div class="threat-table-row">
          <div style="display:flex;align-items:center;">
            <span class="severity-indicator" style="background:${severityColors[t.severity] || 'var(--zd-muted)'};"></span>
            <span class="technical-label" style="font-size:0.65rem;color:${severityColors[t.severity] || 'inherit'};">${t.severity}</span>
          </div>
          <div>
            <span class="technical-label" style="font-size:0.65rem;border:1px solid var(--zd-border);padding:0.2rem 0.4rem;border-radius:4px;">${t.category}</span>
          </div>
          <div>
            <div style="font-weight:600;font-size:0.95rem;margin-bottom:0.2rem;">${t.title}</div>
            <div style="font-size:0.8rem;color:var(--zd-muted);line-height:1.4;">${t.description}</div>
            <div class="technical-label mt-xs" style="font-size:0.55rem;color:var(--zd-muted);">Source: ${t.source}</div>
          </div>
          <div class="technical-label d-none d-lg-block" style="text-align:right;font-size:0.65rem;">
            ${timeAgo(t.date)}
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
