<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZeroDay Identity — Your cybersecurity profile and network.">
  <title>ZeroDay — Identity</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div id="nav-container"></div>

  <main class="zd-main">
    <!-- Profile Header -->
    <div class="zd-panel mb-lg" id="profile-header"></div>

    <!-- Profile Content Grid -->
    <div class="zd-sidebar-layout profile-layout">
      <!-- Left: Activity & Signals -->
      <div>
        <!-- About Section -->
        <div class="zd-panel mb-lg" id="profile-about"></div>

        <!-- User's Signals -->
        <div class="zd-panel">
          <div class="zd-panel-header">
            <span class="zd-panel-title">◈ Security Signals</span>
          </div>
          <div id="profile-signals"></div>
        </div>
      </div>

      <!-- Right: Connections, Stats, Achievements -->
      <aside>
        <!-- Level & XP -->
        <div class="zd-panel mb-lg" id="profile-xp"></div>

        <!-- Achievements -->
        <div class="zd-panel mb-lg" id="profile-achievements"></div>

        <!-- Connections List -->
        <div class="zd-panel" id="profile-connections"></div>
      </aside>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
