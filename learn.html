<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZeroDay Learn — Cybersecurity educational resources.">
  <title>ZeroDay — Learn</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .learn-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: var(--space-xl);
    }
    .learn-nav {
      position: sticky;
      top: 100px;
    }
    .learn-nav-link {
      display: block;
      padding: 0.5rem 0;
      color: var(--zd-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      border-left: 2px solid transparent;
      padding-left: 1rem;
      margin-bottom: 0.25rem;
      transition: all var(--transition-fast);
    }
    .learn-nav-link:hover, .learn-nav-link.active {
      color: var(--zd-action);
      border-left-color: var(--zd-action);
      background: rgba(21, 150, 56, 0.05);
    }
    
    @media (max-width: 768px) {
      .learn-layout {
        grid-template-columns: 1fr;
      }
      .learn-nav {
        position: static;
        display: flex;
        overflow-x: auto;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--zd-border);
        margin-bottom: 1.5rem;
      }
      .learn-nav-link {
        border-left: none;
        border-bottom: 2px solid transparent;
        padding: 0.5rem 1rem;
        white-space: nowrap;
      }
      .learn-nav-link:hover, .learn-nav-link.active {
        border-left-color: transparent;
        border-bottom-color: var(--zd-action);
      }
    }
  </style>
</head>
<body>

  <div id="nav-container"></div>

  <main class="zd-main">
    <div style="margin-bottom:2.5rem;border-bottom:1px solid var(--zd-border);padding-bottom:1.5rem;">
      <h1 style="margin-bottom:0.25rem;">Knowledge Base</h1>
      <p class="technical-label" style="margin:0;">Defensive security concepts and educational guides</p>
    </div>

    <div class="learn-layout">
      <!-- Side Navigation -->
      <nav class="learn-nav" id="learn-nav">
        <div class="technical-label" style="padding-left:1rem;margin-bottom:1rem;color:var(--zd-text);">CURRICULUM</div>
        <a href="#" class="learn-nav-link active" data-level="all">All Modules</a>
        <a href="#" class="learn-nav-link" data-level="beginner">Beginner (Awareness)</a>
        <a href="#" class="learn-nav-link" data-level="intermediate">Intermediate (Ops)</a>
        <a href="#" class="learn-nav-link" data-level="advanced">Advanced (Research)</a>
      </nav>

      <!-- Content Grid -->
      <div>
        <div class="row g-4" id="learn-content-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <!-- Module Modal -->
  <div class="modal fade" id="moduleModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><span class="technical-label">TRAINING MODULE</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="module-body" style="padding: 2rem;">
          <!-- Populated by JS -->
        </div>
        <div class="modal-footer">
          <button class="btn-zd-primary w-100" data-bs-dismiss="modal" onclick="markModuleComplete()">Mark as Completed</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      document.getElementById('nav-container').innerHTML = buildNavigation('learn');
      initNavToggle();

      renderLearnContent('all');

      document.querySelectorAll('.learn-nav-link').forEach(link => {
        link.addEventListener('click', (e) => {
          e.preventDefault();
          document.querySelectorAll('.learn-nav-link').forEach(l => l.classList.remove('active'));
          e.target.classList.add('active');
          renderLearnContent(e.target.dataset.level);
        });
      });
    });

    function renderLearnContent(levelFilter) {
      const container = document.getElementById('learn-content-grid');
      
      let filtered = learnContent;
      if (levelFilter !== 'all') {
        filtered = learnContent.filter(item => item.level === levelFilter);
      }

      container.innerHTML = filtered.map(item => `
        <div class="col-md-6">
          <div class="learn-card" style="cursor:pointer;height:100%;display:flex;flex-direction:column;" onclick="openModule(${item.id})">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;">
              <span class="learn-level level-${item.level}">${item.level}</span>
              <span class="technical-label" style="font-size:0.6rem;">⏱ ${item.duration}</span>
            </div>
            <h3 style="font-size:1.1rem;margin-bottom:0.5rem;">${item.title}</h3>
            <p style="font-size:0.85rem;color:var(--zd-muted);flex:1;">${item.description}</p>
            <div style="margin-top:1rem;border-top:1px solid var(--zd-border);padding-top:0.75rem;display:flex;gap:0.4rem;flex-wrap:wrap;">
              ${item.topics.slice(0, 3).map(t => `<span class="technical-label" style="font-size:0.55rem;background:var(--zd-surface-alt);padding:0.2rem 0.4rem;border-radius:4px;border:1px solid var(--zd-border);">${t}</span>`).join('')}
              ${item.topics.length > 3 ? `<span class="technical-label" style="font-size:0.55rem;">+${item.topics.length - 3}</span>` : ''}
            </div>
          </div>
        </div>
      `).join('');
    }

    let currentModuleId = null;

    function openModule(id) {
      const item = learnContent.find(l => l.id === id);
      if (!item) return;
      currentModuleId = id;

      document.getElementById('module-body').innerHTML = `
        <div style="margin-bottom:1rem;">
          <span class="learn-level level-${item.level}">${item.level}</span>
          <span class="technical-label ml-2" style="font-size:0.65rem;">${item.category}</span>
        </div>
        <h2 style="font-size:1.75rem;margin-bottom:1.5rem;">${item.title}</h2>
        <p style="font-size:1rem;line-height:1.7;margin-bottom:2rem;">${item.description}</p>
        
        <h4 style="font-family:var(--font-heading);font-size:1.1rem;margin-bottom:1rem;border-bottom:1px solid var(--zd-border);padding-bottom:0.5rem;">Key Objectives</h4>
        <ul style="line-height:1.8;color:var(--zd-muted);">
          ${item.topics.map(t => `<li>Understand ${t.toLowerCase()} mechanisms and defenses.</li>`).join('')}
        </ul>

        <div style="margin-top:2rem;padding:1rem;background:rgba(21, 150, 56, 0.05);border:1px solid var(--zd-border);border-radius:var(--radius-md);">
          <div class="technical-label" style="color:var(--zd-action);margin-bottom:0.5rem;">SIMULATED MODULE</div>
          <p style="font-size:0.85rem;margin:0;color:var(--zd-muted);">This is a conceptual representation for the ZeroDay prototype. In a production environment, this would contain the full interactive lesson content.</p>
        </div>
      `;

      const modal = new bootstrap.Modal(document.getElementById('moduleModal'));
      modal.show();
    }

    function markModuleComplete() {
      if (currentModuleId) {
        showToast('Module marked as completed. XP added to your identity.', 'success');
        // In a real app, this would update the user's XP in app.js
      }
    }
  </script>
</body>
</html>
