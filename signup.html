<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZeroDay — Sign up for the cybersecurity network.">
  <title>ZeroDay — Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: var(--zd-desktop);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .auth-card {
      background: var(--zd-surface);
      border: 1px solid var(--zd-border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand h1 {
      font-size: 2.5rem;
      margin: 0;
      color: #fff;
    }
    .auth-tagline {
      font-size: 0.85rem;
      color: var(--zd-muted);
    }
    .social-link {
      color: var(--zd-action);
      text-decoration: none;
      font-weight: 600;
    }
    .social-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="auth-brand">
      <h1>ZeroDay</h1>
      <div class="auth-tagline">Create an Account</div>
    </div>

    <form id="signup-form" novalidate>
      <div class="zd-form-group">
        <label for="reg-name" class="zd-label">Full Name</label>
        <input type="text" class="zd-input" id="reg-name" placeholder="Full Name" required>
        <div class="zd-error-msg" id="name-error">Name is required.</div>
      </div>

      <div class="zd-form-group">
        <label for="reg-username" class="zd-label">Username</label>
        <input type="text" class="zd-input" id="reg-username" placeholder="Username" required>
        <div class="zd-error-msg" id="username-error">Username is required and must be unique.</div>
      </div>

      <div class="zd-form-group">
        <label for="reg-password" class="zd-label">Password</label>
        <input type="password" class="zd-input" id="reg-password" placeholder="Password (Min. 8 chars)" required>
        <div class="zd-error-msg" id="password-error">Password must be at least 8 characters.</div>
      </div>

      <div class="zd-error-msg" id="signup-error" style="margin-bottom:1.5rem;padding:0.75rem;background:rgba(217, 74, 74, 0.1);border:1px solid var(--zd-error);border-radius:var(--radius-sm);">
        Registration failed.
      </div>

      <button type="submit" class="btn-zd-primary w-100" id="signup-submit" style="padding:0.85rem;font-size:1rem;border-radius:30px;">
        Sign up
      </button>
    </form>

    <div style="margin-top:2rem;text-align:center;font-size:0.9rem;">
      <span style="color:var(--zd-muted);">Already have an account?</span>
      <a href="index.html" class="social-link" style="margin-left:0.5rem;">Log in</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
