<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZeroDay Secure Channels — Encrypted private messaging.">
  <title>ZeroDay — Secure Channels</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Messaging-specific layout overrides */
    .messaging-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      background: var(--zd-surface);
      border: 1px solid var(--zd-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      height: calc(100vh - 180px);
      min-height: 500px;
    }
    .channels-sidebar {
      border-right: 1px solid var(--zd-border);
      display: flex;
      flex-direction: column;
      background: var(--zd-surface-alt);
    }
    .channels-header {
      padding: var(--space-md);
      border-bottom: 1px solid var(--zd-border);
      background: var(--zd-surface);
    }
    .channels-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-area {
      display: flex;
      flex-direction: column;
      background: var(--zd-surface);
    }
    .chat-header {
      padding: var(--space-md);
      border-bottom: 1px solid var(--zd-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--space-lg);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }
    .chat-input-area {
      padding: var(--space-md);
      border-top: 1px solid var(--zd-border);
      background: var(--zd-surface-alt);
    }
    
    @media (max-width: 768px) {
      .messaging-layout {
        grid-template-columns: 1fr;
      }
      .channels-sidebar {
        display: block; /* Toggled by JS */
      }
      .chat-area {
        display: none; /* Toggled by JS */
      }
      .messaging-layout.chat-active .channels-sidebar {
        display: none;
      }
      .messaging-layout.chat-active .chat-area {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <div id="nav-container"></div>

  <main class="zd-main">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
      <div>
        <h1 style="margin-bottom:0.25rem;">Secure Channels</h1>
        <p class="technical-label" style="margin:0;">End-to-end encrypted messaging</p>
      </div>
      <button class="btn-zd-secondary btn-zd-sm" onclick="openNewChatModal()">
        + New Channel
      </button>
    </div>

    <!-- Messaging Workspace -->
    <div class="messaging-layout" id="messaging-workspace">
      
      <!-- Channels List (Sidebar) -->
      <aside class="channels-sidebar" id="channels-sidebar">
        <div class="channels-header">
          <div class="zd-search">
            <span class="search-icon">◎</span>
            <input type="text" class="zd-input" id="channel-search" placeholder="Search channels..." style="padding: 0.5rem 0.5rem 0.5rem 2rem; font-size: 0.8rem;">
          </div>
        </div>
        <div class="channels-list" id="channels-list">
          <!-- Populated by JS -->
        </div>
      </aside>

      <!-- Chat Area -->
      <section class="chat-area" id="chat-area">
        <!-- Empty State -->
        <div id="chat-empty-state" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--zd-muted);">
          <div style="font-size:3rem;opacity:0.3;margin-bottom:1rem;">▧</div>
          <div style="font-family:var(--font-mono);font-size:0.8rem;letter-spacing:0.05em;text-transform:uppercase;">Select a channel to view messages</div>
        </div>

        <!-- Active Chat -->
        <div id="active-chat" style="display:none;flex-direction:column;height:100%;">
          <div class="chat-header">
            <div style="display:flex;align-items:center;gap:0.75rem;">
              <button class="btn-zd-secondary btn-zd-sm d-md-none" onclick="backToChannels()" style="padding:0.2rem 0.5rem;">←</button>
              <div id="chat-header-user" style="display:flex;align-items:center;gap:0.75rem;"></div>
            </div>
            <div>
              <span class="technical-label" style="font-size:0.55rem;color:var(--zd-action);border:1px solid var(--zd-action);padding:0.2rem 0.4rem;border-radius:4px;">SECURE CONNECTION</span>
            </div>
          </div>
          
          <div class="chat-messages" id="chat-messages">
            <!-- Messages populated here -->
          </div>
          
          <div class="chat-input-area">
            <form id="send-message-form" style="display:flex;gap:0.5rem;" novalidate>
              <input type="text" class="zd-input" id="message-input" placeholder="Transmit secure message..." required autocomplete="off">
              <button type="submit" class="btn-zd-primary" style="padding:0 1.5rem;">SEND</button>
            </form>
            <div class="zd-error-msg" id="message-error" style="margin-top:0.3rem;">Message cannot be empty.</div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- New Chat Modal -->
  <div class="modal fade" id="newChatModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><span class="technical-label">ESTABLISH CHANNEL</span></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted-zd" style="font-size:0.85rem;margin-bottom:1rem;">Select a user to establish a secure channel with.</p>
          <div class="zd-form-group">
            <select class="zd-select" id="new-chat-target" size="6" style="padding:0;overflow-y:auto;height:200px;">
              <!-- Populated by JS -->
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn-zd-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn-zd-primary" onclick="startNewChat()">Establish</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
