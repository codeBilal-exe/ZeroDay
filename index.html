<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ZeroDay — Cybersecurity social and knowledge-sharing platform.">
  <title>ZeroDay — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background:
        radial-gradient(circle at top left, rgba(129, 217, 162, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(55, 120, 94, 0.2), transparent 32%),
        var(--zd-desktop);
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }

    .login-shell {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .login-shell::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(160, 214, 183, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(160, 214, 183, 0.06) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 100%);
      pointer-events: none;
    }

    .auth-card {
      position: relative;
      background: rgba(16, 25, 22, 0.66);
      border: 1px solid var(--color-border);
      border-radius: 28px;
      padding: 2.25rem 2rem 2rem;
      width: min(100%, 420px);
      box-shadow: 0 22px 60px rgba(1, 11, 8, 0.72);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 1;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }

    .auth-brand h1 {
      font-size: clamp(2.2rem, 3vw, 3rem);
      margin: 0;
      letter-spacing: 0.08em;
      color: var(--color-ink);
    }

    .auth-brand .auth-tagline {
      margin-top: 0.55rem;
      font-size: 0.7rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--color-muted);
      font-family: var(--font-mono);
    }

    .login-status {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.55rem 0.9rem;
      border-radius: 999px;
      background: rgba(10, 17, 15, 0.52);
      border: 1px solid rgba(176, 215, 188, 0.18);
      color: var(--color-muted);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-family: var(--font-mono);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 1;
    }

    .status-indicator {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--color-accent);
      box-shadow: 0 0 0 6px rgba(129, 217, 162, 0.12);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }

    .social-link {
      color: var(--color-accent);
      text-decoration: none;
      font-weight: 600;
    }

    .social-link:hover {
      color: var(--color-accent-strong);
      text-decoration: underline;
    }

    @keyframes pulse-dot {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.65;
        transform: scale(0.9);
      }
    }
  </style>
</head>

<body class="login-shell">

  <div class="auth-card">
    <div class="auth-brand">
      <h1>ZeroDay</h1>
      <div class="auth-tagline">Cybersecurity Network</div>
    </div>

    <form id="login-form" novalidate>
      <div class="zd-form-group">
        <label for="login-username" class="zd-label">Username</label>
        <input type="text" class="zd-input" id="login-username" placeholder="Enter username" autocomplete="username"
          required>
        <div class="zd-error-msg" id="username-error">Username is required.</div>
      </div>

      <div class="zd-form-group">
        <label for="login-password" class="zd-label">Password</label>
        <input type="password" class="zd-input" id="login-password" placeholder="Password"
          autocomplete="current-password" required>
        <div class="zd-error-msg" id="password-error">Password is required.</div>
      </div>

      <div class="zd-error-msg" id="auth-error"
        style="margin-bottom:1.5rem;padding:0.75rem;background:rgba(247, 120, 102, 0.08);border:1px solid var(--zd-error);border-radius:var(--radius-sm);">
        Invalid username or password.
      </div>

      <button type="submit" class="btn-zd-primary w-100" id="login-submit"
        style="padding:0.85rem;font-size:1rem;border-radius:999px;">
        Log in
      </button>
    </form>

    <div style="margin-top:2rem;text-align:center;font-size:0.9rem;">
      <span style="color:var(--zd-muted);">Don't have an account?</span>
      <a href="signup.html" class="social-link" style="margin-left:0.5rem;">Sign up</a>
    </div>

    <div class="login-status" id="system-status"><span class="status-indicator"></span> System ready</div>

    <!-- Demo Credentials -->
    <div style="margin-top:2rem;text-align:center;font-size:0.75rem;color:var(--zd-muted);">
      <div>Demo: bilal.asif / zeroday123</div>
      <div>Demo: sarah.khan / secresearch!</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>

</html>
